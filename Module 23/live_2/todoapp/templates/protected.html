{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Protected{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded shadow text-center">
    <h2 class="text-3xl font-bold mb-6 text-green-600">Welcome, {{ user.username }}!</h2>
    <p class="text-gray-700 mb-4">You have successfully logged in to the protected area of the TodoApp.</p>
    <p>Your Email address is : {{user.email}}</p>
    <a href="{% url 'task_list' %}" class="inline-block mt-4 bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Go to Home</a>
</div>
{% endblock %}
