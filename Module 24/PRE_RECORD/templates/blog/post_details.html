{% extends 'blog/base.html' %}
{% block title %}
  {{ post.title }}
{% endblock %}

{% block content %}
  <div class="container my-4 p-4 bg-light rounded shadow-sm">
    <h2 class="display-4">{{ post.title }}</h2>
    <small class="text-muted">By <strong>{{ post.author }}</strong> on {{ post.created_at }}</small>
    <hr class="my-4" />
    <p class="lead">{{ post.content }}</p>

    {% if user == post.author %}
      <div class="mt-4 d-flex gap-4">
        <!-- Edit Button -->
        <a  href="{% url 'post_update' post.id %}" class="btn btn-outline-warning mr-4">Edit Post</a>

        <!-- Delete Button -->
        <form action="{% url 'post_delete' post.id %}" method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this post?')">Delete Post</button>
        </form>
      </div>
    {% endif %}
  </div>
{% endblock %}
